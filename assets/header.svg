  .cmd{fill:#b7c4ce;font-size:16px}.tiny{fill:#62717d;font-size:10px;letter-spacing:2px}
  @keyframes blink{0%,45%{opacity:1}46%,100%{opacity:0}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .cursor{animation:blink 1s steps(1) infinite}.pulse{animation:pulse 3s ease-in-out infinite}
 </style>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#17212a" stroke-width=".6" opacity=".45"/></pattern>
</defs>
<rect width="880" height="300" rx="18" fill="url(#bg)"/><rect width="880" height="300" rx="18" fill="url(#grid)"/>
